<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070708" />
  <title>kiln</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- PNG, not SVG: some platforms rasterize an app window's taskbar icon
       from the favicon and cannot read SVG -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/kiln-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/kiln-512.png" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>

  <header id="topbar">
    <div id="brand">
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="16" height="16" rx="3.5" fill="#141416"/>
        <path d="M4 5.5 7 8l-3 2.5M8.5 11H12" stroke="#e8845a" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="wordmark">kiln</span>
    </div>
    <div class="bar-sep"></div>
    <!-- Hidden for now at the user's request; the home view itself still works,
         so unhiding this button is all it takes to bring it back. -->
    <button id="pill-home" class="pill home-pill" hidden title="Everything that is running">
      <svg class="ic" width="14" height="14"><use href="#i-home"/></svg><span class="name">home</span>
    </button>
    <nav id="project-pills"></nav>
    <button id="pill-add" class="pill ghost-pill" title="Add a project">+</button>
    <div class="bar-spacer"></div>
    <span id="attention" hidden></span>
  </header>

  <div id="shell">
    <aside id="files-panel">
      <header>
        <svg class="ic" width="16" height="16"><use href="#i-folder"/></svg>
        <h2>files</h2>
        <span id="files-project" class="files-project"></span>
        <button class="icon" id="files-refresh" title="Refresh">
          <svg class="ic" width="14" height="14"><use href="#i-refresh"/></svg>
        </button>
      </header>
      <div id="files-body"></div>
      <footer id="files-foot">
        <button id="btn-settings" title="project settings">
          <svg class="ic" width="16" height="16"><use href="#i-gear"/></svg>
          <span>project settings</span>
        </button>
      </footer>
    </aside>

    <main id="viewport">
      <div id="canvas">
        <svg id="edges" aria-hidden="true"></svg>
      </div>

      <div id="dock">
        <button id="btn-dispatch" class="primary">
          <svg class="ic" width="15" height="15"><use href="#i-bolt"/></svg>dispatch
        </button>
        <button id="btn-note" title="new note">
          <svg class="ic" width="15" height="15"><use href="#i-note"/></svg>note
        </button>
        <span class="dock-sep"></span>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="zoom-reset" title="Back to 100%">100%</button>
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-fit" title="fit all">fit</button>
      </div>

      <!-- Overlays the canvas rather than replacing it: the terminals stay laid
           out underneath, so nothing refits when you come home and go back. -->
      <section id="home" hidden>
        <header id="home-head">
          <h1>home</h1>
          <span id="home-summary"></span>
        </header>
        <div id="home-body"></div>
      </section>

      <div id="disconnected-banner" hidden>lost the server, reconnecting…</div>
    </main>

    <aside id="drawer" hidden>
      <header>
        <h2 id="drawer-title"></h2>
        <button class="icon" id="drawer-close" title="Close">×</button>
      </header>
      <div id="drawer-body"></div>
    </aside>

    <nav id="rail">
      <button class="rail-btn drawer-btn" data-drawer="prompts" title="prompts">
        <svg class="ic" width="19" height="19"><use href="#i-prompt"/></svg><span>prompts</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="skills" title="skills">
        <svg class="ic" width="19" height="19"><use href="#i-skill"/></svg><span>skills</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="secrets" title="secrets">
        <svg class="ic" width="19" height="19"><use href="#i-key"/></svg><span>secrets</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="memory" title="memory">
        <svg class="ic" width="19" height="19"><use href="#i-memory"/></svg><span>memory</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="connections" title="connections">
        <svg class="ic" width="19" height="19"><use href="#i-plug"/></svg><span>links</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="usage" title="usage">
        <svg class="ic" width="19" height="19"><use href="#i-usage"/></svg><span>usage</span>
      </button>
      <button class="rail-btn drawer-btn" data-drawer="history" title="history">
        <svg class="ic" width="19" height="19"><use href="#i-history"/></svg><span>history</span>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="btn-status" title="show or hide status chips">
        <svg class="ic" width="19" height="19"><use href="#i-pulse"/></svg><span>status</span>
      </button>
      <button class="rail-btn" id="btn-notify" title="notify">
        <svg class="ic" width="19" height="19"><use href="#i-bell"/></svg><span>notify</span>
      </button>
      <span id="conn-dot" title="Connected to the server"></span>
    </nav>
  </div>

  <!-- dispatch modal -->
  <div class="modal-backdrop" id="dispatch-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dispatch-title">
      <h2 id="dispatch-title">dispatch</h2>

      <span class="field-label">engine</span>
      <div class="seg-row" id="engine-row" role="radiogroup" aria-label="Engine"></div>
      <button class="link-more" id="engine-more" aria-expanded="false">more engines</button>
      <div class="seg-row" id="engine-row-more" role="radiogroup" aria-label="Other engines" hidden></div>

      <div id="auth-field" hidden>
        <span class="field-label">subscription</span>
        <div class="seg-row" id="auth-row" role="radiogroup" aria-label="Subscription"></div>
      </div>

      <div class="field-grid">
        <label class="field">
          <span>project</span>
          <select id="d-project"></select>
        </label>
        <label class="field">
          <span>model</span>
          <select id="d-model"></select>
        </label>
      </div>

      <div class="field-grid">
        <label class="field" id="d-preset-field">
          <span>preset</span>
          <select id="d-preset"></select>
        </label>
        <label class="field">
          <span>reasoning</span>
          <select id="d-effort"></select>
        </label>
      </div>
      <div id="d-params"></div>

      <label class="field" id="d-task-field">
        <span>task <em>(empty = interactive)</em></span>
        <textarea id="d-task" rows="5" spellcheck="false"></textarea>
      </label>

      <div class="check-row" id="d-flags">
        <label><input type="checkbox" id="d-skip" checked /> skip permissions</label>
        <label><input type="checkbox" id="d-env" checked /> load .env</label>
      </div>

      <label class="field">
        <span>name <em>(optional)</em></span>
        <input id="d-name" type="text" maxlength="60" />
      </label>

      <div class="modal-actions">
        <button class="ghost" data-action="cancel">cancel</button>
        <button class="primary" id="d-go">launch</button>
      </div>
    </div>
  </div>

  <!-- project settings modal -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">project settings</h2>
      <p class="modal-sub" id="s-project-name"></p>

      <label class="field">
        <span>env profile</span>
        <select id="s-profile"></select>
      </label>
      <div class="profile-actions">
        <button class="ghost small" id="s-manage-secrets">manage secrets</button>
      </div>
      <p class="drawer-hint">Project .env wins on conflicts.</p>

      <span class="field-label">dispatch defaults</span>
      <div class="field-grid">
        <label class="field">
          <span>engine</span>
          <select id="s-engine"></select>
        </label>
        <label class="field">
          <span>model</span>
          <select id="s-model"></select>
        </label>
      </div>
      <div class="field-grid">
        <label class="field" id="s-auth-field" hidden>
          <span>subscription</span>
          <select id="s-auth"></select>
        </label>
        <label class="field">
          <span>reasoning</span>
          <select id="s-effort"></select>
        </label>
      </div>

      <div class="modal-actions">
        <button class="ghost" data-action="cancel">cancel</button>
        <button class="primary" id="s-save">save</button>
      </div>
    </div>
  </div>

  <!-- generic preview / editor modal -->
  <div class="modal-backdrop" id="view-modal" hidden>
    <div class="modal wide" role="dialog" aria-modal="true">
      <h2 id="view-title" class="mono"></h2>
      <pre id="view-pre" class="view-pre" hidden></pre>
      <textarea id="view-edit" class="view-edit" rows="18" spellcheck="false" hidden></textarea>
      <div class="modal-actions" id="view-actions"></div>
    </div>
  </div>

  <template id="card-template">
    <article class="card" data-status="running">
      <header class="card-head">
        <span class="s-dot" aria-hidden="true"></span>
        <h3 class="card-title" title="Double-click to rename"></h3>
        <span class="engine-tag"></span>
        <span class="env-tag" hidden>env</span>
        <span class="proj-tag" hidden></span>
        <span class="badge"></span>
        <div class="card-buttons">
          <button class="icon" data-action="restore" title="restart this session" hidden>▶</button>
          <button class="icon" data-action="kill" title="kill">■</button>
          <button class="icon danger" data-action="close" title="close">×</button>
        </div>
      </header>
      <div class="note-strip" hidden></div>
      <div class="term-body"></div>
      <footer class="card-foot">
        <span class="foot-main"></span>
        <span class="elapsed" data-start=""></span>
      </footer>
      <div class="resize-handle" aria-hidden="true"></div>
    </article>
  </template>

  <template id="viewer-template">
    <article class="viewer" tabindex="-1">
      <header class="viewer-head">
        <img class="fi viewer-icon" alt="" width="16" height="16" />
        <h3 class="viewer-title"></h3>
        <span class="viewer-lang"></span>
        <div class="card-buttons">
          <button class="icon danger" data-action="close" title="close">×</button>
        </div>
      </header>
      <div class="viewer-body">
        <pre class="viewer-gutter" aria-hidden="true"></pre>
        <pre class="viewer-code"><code></code></pre>
      </div>
      <footer class="viewer-foot">
        <span class="viewer-path"></span>
        <span class="viewer-meta"></span>
      </footer>
      <div class="resize-handle" aria-hidden="true"></div>
    </article>
  </template>

  <template id="note-template">
    <article class="note">
      <header class="note-head">
        <svg class="ic" width="15" height="15"><use href="#i-note"/></svg>
        <h3 class="note-title" title="Double-click to rename"></h3>
        <div class="card-buttons">
          <button class="icon" data-action="edit" title="edit">✎</button>
          <button class="icon danger" data-action="close" title="delete">×</button>
        </div>
      </header>
      <div class="note-tools" hidden>
        <select class="nt-block" title="paragraph style">
          <option value="p">body</option>
          <option value="h1">title</option>
          <option value="h2">heading</option>
          <option value="h3">subhead</option>
          <option value="blockquote">quote</option>
          <option value="pre">code</option>
        </select>
        <span class="nt-sep"></span>
        <button class="nt" data-cmd="bold" title="bold — ctrl+B"><b>B</b></button>
        <button class="nt" data-cmd="italic" title="italic — ctrl+I"><i>I</i></button>
        <button class="nt" data-cmd="underline" title="underline — ctrl+U"><u>U</u></button>
        <button class="nt" data-cmd="strikeThrough" title="strikethrough"><s>S</s></button>
        <button class="nt" data-cmd="inlineCode" title="inline code">&lt;/&gt;</button>
        <span class="nt-sep"></span>
        <button class="nt" data-cmd="insertUnorderedList" title="bulleted list — ctrl+shift+8">•</button>
        <button class="nt" data-cmd="insertOrderedList" title="numbered list — ctrl+shift+7">1.</button>
        <button class="nt" data-cmd="outdent" title="outdent — shift+tab">⇤</button>
        <button class="nt" data-cmd="indent" title="indent — tab">⇥</button>
        <span class="nt-sep"></span>
        <button class="nt" data-cmd="createLink" title="link — ctrl+K">↗</button>
        <button class="nt" data-cmd="removeFormat" title="clear formatting">Tx</button>
      </div>
      <div class="note-body">
        <div class="note-render" spellcheck="false"></div>
      </div>
      <footer class="note-foot">
        <span class="note-meta"></span>
      </footer>
      <div class="resize-handle" aria-hidden="true"></div>
    </article>
  </template>

  <template id="browser-template">
    <div class="bcard">
      <div class="bcard-head">
        <svg class="ic" width="14" height="14"><use href="#i-globe"/></svg>
        <span class="bcard-host">browser</span>
        <span class="elapsed" data-start=""></span>
        <button class="icon" data-action="open" title="open in your browser" hidden>↗</button>
      </div>
      <div class="bcard-shot" hidden><img alt="What the agent's browser shows" /></div>
      <ul class="bcard-actions"></ul>
    </div>
  </template>

  <template id="mini-template">
    <div class="mini" data-status="running">
      <div class="mini-head">
        <span class="s-dot"></span>
        <span class="mini-type"></span>
        <span class="elapsed" data-start=""></span>
      </div>
      <div class="mini-title"></div>
    </div>
  </template>

  <script src="/vendor/marked/marked.min.js"></script>
  <script src="/vendor/hljs/highlight.min.js"></script>
  <script src="/vendor/hljs/powershell.min.js"></script>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-webgl/lib/addon-webgl.js"></script>
  <!-- Modern glyph widths. Without it xterm measures by Unicode 6 tables while
       agent TUIs measure by current ones, and every cell after a wide glyph
       lands one column off. -->
  <script src="/vendor/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="/app.js"></script>
  <!-- sw.js only steps in when the server is unreachable: it swaps Edge's
       "can't connect" page for one that waits and reloads into the app. -->
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
